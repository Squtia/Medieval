<div class="sw-container">
  <!-- 頂部導航列 -->
  <div class="sw-topbar">
    <div class="sw-title-group">
      <span class="sw-logo-icon">🔮</span>
      <div>
        <h1 class="sw-main-title">全自訂積木技能工坊</h1>
        <p class="sw-subtitle">Composite Skill System & Dynamic Combat Workshop</p>
      </div>
      <span class="sw-badge">Studio 3.0</span>
    </div>
    <div class="sw-actions">
      <button class="sw-btn" id="btn-sw-nav-combat">⚔️ 戰鬥工坊</button>
      <button class="sw-btn" id="btn-sw-nav-story">📜 故事工坊</button>
      <button class="sw-btn" id="btn-sw-nav-equip">🛠️ 裝備工坊</button>
      <button class="sw-btn" id="btn-sw-history">🕒 歷史快照</button>
      <button class="sw-btn sw-btn-primary" id="btn-sw-save-disk">💾 永久寫入專案磁碟</button>
    </div>
  </div>

  <!-- 主工作區 (雙欄佈局) -->
  <div class="sw-workspace">
    <!-- 左欄：技能庫清單 -->
    <div class="sw-sidebar">
      <div class="sw-sidebar-header">
        <div class="sw-sidebar-title">
          <span>📚 技能庫</span>
          <span class="sw-counter" id="sw-skill-count">0</span>
        </div>
        <button class="sw-btn sw-btn-sm sw-btn-gold" id="btn-sw-new-skill">➕ 新增技能</button>
      </div>

      <div class="sw-filter-bar">
        <input type="text" class="sw-input" id="sw-search-input" placeholder="🔍 搜尋技能名稱或 ID..." style="flex: 1;">
        <select class="sw-select" id="sw-filter-category" style="width: 110px;">
          <option value="ALL">全部類別</option>
          <option value="MONSTER">魔物技能</option>
          <option value="HERO_BASE">基礎職業</option>
          <option value="HERO_ADVANCED">進階職業</option>
          <option value="EQUIPMENT">裝備特技</option>
        </select>
      </div>

      <div class="sw-skill-list" id="sw-skill-list-container">
        <!-- 動態渲染技能卡片 -->
      </div>
    </div>

    <!-- 右欄：積木配置工作台 -->
    <div class="sw-editor" id="sw-editor-pane">
      <div class="sw-empty-state" id="sw-empty-placeholder">
        <div style="font-size: 3rem; margin-bottom: 1rem;">✨</div>
        <h3>請由左側選取技能或點擊「新增技能」開始設計</h3>
        <p style="color: #9ca3af; font-size: 0.9rem;">支援主動施放、受擊反制、擊殺觸發、殘血爆發等 7 大時機與 20+ 款進階積木</p>
      </div>

      <div class="sw-editor-content" id="sw-editor-form" style="display: none;">
        <!-- 基礎資訊卡 -->
        <div class="sw-card">
          <div class="sw-card-header">
            <span>⚙️ 基本設定</span>
            <div style="display: flex; gap: 8px;">
              <button class="sw-btn sw-btn-sm sw-btn-danger" id="btn-sw-delete-skill">🗑️ 刪除</button>
              <button class="sw-btn sw-btn-sm" id="btn-sw-duplicate-skill">📑 複製</button>
            </div>
          </div>
          <div class="sw-grid-4">
            <div class="sw-form-group">
              <label class="sw-label">技能代號 (ID)</label>
              <input type="text" class="sw-input font-mono" id="inp-sw-id" placeholder="如: DRAGON_INFERNO">
            </div>
            <div class="sw-form-group">
              <label class="sw-label">技能名稱</label>
              <input type="text" class="sw-input" id="inp-sw-name" placeholder="如: 滅世龍炎">
            </div>
            <div class="sw-form-group">
              <label class="sw-label">技能圖標 (Icon)</label>
              <div style="display: flex; gap: 8px; align-items: center;">
                <div id="sw-icon-preview" style="width: 38px; height: 38px; background: rgba(0,0,0,0.4); border: 1px solid var(--sw-border); border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.3rem; flex-shrink: 0;" title="點擊直接挑選圖標">🔮</div>
                <button type="button" class="sw-btn sw-btn-sm" id="btn-sw-pick-icon" style="padding: 6px 10px; font-size: 0.78rem;">🔍 挑選圖標</button>
                <input type="text" class="sw-input font-mono" id="inp-sw-icon" placeholder="🔥 或代碼" style="flex: 1; font-size: 0.8rem;">
              </div>
            </div>
            <div class="sw-form-group">
              <label class="sw-label">技能分類</label>
              <select class="sw-select" id="inp-sw-category">
                <option value="MONSTER">魔物技能 (MONSTER)</option>
                <option value="HERO_BASE">基礎職業 (HERO_BASE)</option>
                <option value="HERO_ADVANCED">進階職業 (HERO_ADVANCED)</option>
                <option value="EQUIPMENT">裝備特技 (EQUIPMENT)</option>
              </select>
            </div>
          </div>
          <div class="sw-grid-3" style="margin-top: 12px;">
            <div class="sw-form-group">
              <label class="sw-label">MP 消耗</label>
              <input type="number" class="sw-input" id="inp-sw-mp" min="0" value="20">
            </div>
            <div class="sw-form-group">
              <label class="sw-label">冷卻回合 (CD)</label>
              <input type="number" class="sw-input" id="inp-sw-cd" min="0" value="0">
            </div>
            <div class="sw-form-group" style="grid-column: span 1;">
              <label class="sw-label">AI 優先級係數</label>
              <input type="number" class="sw-input" id="inp-sw-ai-weight" min="1" value="10" placeholder="預設自動計算">
            </div>
          </div>
          <div class="sw-form-group" style="margin-top: 12px;">
            <label class="sw-label">中文技能說明 (戰鬥與介面呈現)</label>
            <textarea class="sw-textarea" id="inp-sw-desc" rows="2" placeholder="詳細描述技能消耗與效果..."></textarea>
          </div>
        </div>

        <!-- 積木編排區 -->
        <div class="sw-card" style="margin-top: 16px;">
          <div class="sw-card-header">
            <div>
              <span>🧩 效果積木流 (Effect Pipeline)</span>
              <span style="font-size: 0.8rem; color: #9ca3af; margin-left: 8px;">由上至下依序執行</span>
            </div>
            <button class="sw-btn sw-btn-sm sw-btn-gold" id="btn-sw-add-block">➕ 新增積木</button>
          </div>
          <div class="sw-blocks-container" id="sw-blocks-list">
            <!-- 動態渲染積木卡片 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 全圖集通用圖標選擇器 Modal -->
  <div id="modal-sw-icon-picker" style="position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); z-index: 999999; display: none; align-items: center; justify-content: center; box-sizing: border-box;">
    <div style="max-width: 820px; width: 92%; max-height: 88vh; display: flex; flex-direction: column; background: #0f172a; border: 1px solid var(--sw-primary); border-radius: 10px; color: #f8fafc; box-shadow: 0 20px 50px rgba(0,0,0,0.9); overflow: hidden;">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--sw-border); background: #1e293b;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 1.2rem; font-weight: bold; color: var(--sw-gold);">🎨 技能圖標庫挑選器</span>
        </div>
        <button type="button" id="btn-sw-icon-picker-close" class="sw-btn sw-btn-sm sw-btn-danger">✕ 關閉</button>
      </div>

      <!-- 分類標籤 -->
      <div id="sw-icon-picker-tabs" style="display: flex; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--sw-border); background: #0b0f19; overflow-x: auto; flex-shrink: 0;">
        <!-- 動態標籤 -->
      </div>

      <!-- 搜尋與手動輸入列 -->
      <div style="padding: 10px 18px; display: flex; gap: 10px; align-items: center; background: #111827; border-bottom: 1px solid var(--sw-border);">
        <input type="text" id="inp-sw-icon-picker-search" placeholder="🔍 搜尋圖標名稱或 ID..." class="sw-input" style="flex: 1;">
        <input type="text" id="inp-sw-icon-picker-custom" placeholder="或直接輸入 Emoji / ID" class="sw-input font-mono" style="width: 180px;">
        <button type="button" class="sw-btn sw-btn-primary sw-btn-sm" id="btn-sw-icon-picker-apply-custom">套用</button>
      </div>

      <!-- 圖標網格清單 -->
      <div id="sw-icon-picker-grid" style="flex: 1; overflow-y: auto; padding: 14px 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; max-height: 480px;">
        <!-- 動態圖標項目 -->
      </div>

      <div style="padding: 8px 18px; border-top: 1px solid var(--sw-border); background: #0b0f19; font-size: 0.78rem; color: var(--sw-text-muted); display: flex; justify-content: space-between;">
        <span id="sw-icon-picker-count">共 0 個圖標</span>
        <span>💡 點擊圖標即可直接選取並套用至當前技能</span>
      </div>
    </div>
  </div>
</div>

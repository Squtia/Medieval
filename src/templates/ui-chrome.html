  <div id="transition-overlay"></div>
  <div id="map-tooltip"></div>
  <div id="adv-tooltip"></div>
  <div id="global-tooltip"></div>
  <div id="app-background"></div>

  <!-- 戰鬥結算 Modal -->
  <div id="combat-modal">
    <div id="combat-stage" class="combat-stage">
      <div id="combat-player-team" class="combat-team player-team"></div>
      <div style="font-family: 'Cinzel', serif; font-size: 2em; color: #ef4444; margin: auto 20px; font-weight: bold; text-shadow: 0 0 10px #000; align-self: center;">VS</div>
      <div id="combat-enemy-team" class="combat-team enemy-team"></div>
    </div>
    <div id="combat-log-area" class="combat-log-area"></div>
    <div class="combat-footer" style="justify-content: space-between;">
      <div style="display: flex; gap: 10px; align-items: center;">
        <span style="font-size: 0.9em; color: #cbd5e1;">播放速度:</span>
        <button id="btn-combat-speed-1x" class="action-btn active" style="padding: 5px 10px; font-size: 0.9em; border: 1px solid #eab308; color: #eab308;">1x</button>
        <button id="btn-combat-speed-2x" class="action-btn" style="padding: 5px 10px; font-size: 0.9em; border: 1px solid #64748b; color: #64748b;">2x</button>
      </div>
      <div>
        <button id="btn-combat-skip" class="action-btn" style="background: #eab308; color: #000;">⏩ 瞬間完成</button>
        <button id="btn-combat-close" class="action-btn" style="background: #10b981; display: none;">完成</button>
      </div>
    </div>
    <div id="combat-result-overlay" class="combat-result-overlay">
      <h2 id="combat-result-title" style="font-size: 3em; margin-bottom: 20px; color: #eab308;">戰鬥勝利</h2>
      <p id="combat-result-desc" style="font-size: 1.2em; margin-bottom: 30px;"></p>
      <button id="btn-combat-result-close" class="action-btn" style="background: #10b981; font-size: 1.2em;">返回</button>
    </div>
    </div>
  </div>

  <!-- 歷史戰鬥紀錄已移至左側抽屜面板 (#combat-history-panel)，見下方 -->

  <!-- 商隊預設指令面板 -->
  <div id="modal-trade-planner" class="modal-overlay" style="display: none; z-index: 2100;">
    <div class="modal-content" style="max-width: 800px; text-align: left;">
      <h2 id="trade-planner-title">📜 商隊指令面板</h2>
      <p>請為各個中途站設定預設買賣指令，並分配商隊本金與護衛。</p>
      
      <div id="trade-planner-nodes" style="max-height: 350px; overflow-y: auto; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 10px;">
        <!-- 動態生成各節點設定 -->
      </div>
      
      <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px;">
        <div style="display: flex; gap: 20px; align-items: center;">
          <div style="flex: 1;">
            <label>💰 投入商隊本金：</label>
            <input type="number" id="trade-planner-gold" value="500" style="width: 100px; padding: 5px;" min="0">
          </div>
          <div style="flex: 1;">
            <p id="trade-planner-capacity" style="color: #eab308; font-weight: bold; margin: 0;">商隊最大載重量: 0</p>
          </div>
        </div>
        <div style="display: flex; gap: 20px; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
          <div style="flex: 1;">
            <p id="trade-planner-expected-cost" style="color: #3b82f6; font-weight: bold; margin: 0;">預計買入總金額: 0 金幣</p>
          </div>
          <div style="flex: 1;">
            <p id="trade-planner-expected-weight" style="color: #10b981; font-weight: bold; margin: 0;">預計買入總重量: 0</p>
          </div>
        </div>
        <div style="display: flex; gap: 20px; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
          <div style="flex: 1;">
            <p id="trade-planner-expected-days" style="color: #60a5fa; font-weight: bold; margin: 0;">預計旅途天數: 0 天 (返程依距離計)</p>
          </div>
        </div>
      </div>

      <div id="trade-planner-adv-list" class="adventurer-list" style="max-height: 150px; margin-bottom: 20px;">
         <!-- 傭兵清單 -->
      </div>
      
      <div style="display: flex; gap: 15px;">
        <button id="btn-start-caravan" class="action-btn" style="background: #10b981; flex: 1;">出發！</button>
        <button id="btn-close-trade-planner" class="action-btn" style="background: #b91c1c; flex: 1;">取消</button>
      </div>
    </div>
  </div>

  <!-- 市場交易 Modal -->
  <div id="modal-trade" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 700px;">
      <h2 id="trade-title">⚖️ 市場與商隊</h2>
      <div style="display: flex; gap: 20px;">
        <!-- 本地庫存 -->
        <div style="flex: 1; border: 1px solid rgba(139, 69, 19, 0.5); padding: 15px; background: rgba(0,0,0,0.5);">
          <h3 style="margin-top: 0;">領地物資</h3>
          <div id="trade-inventory" style="max-height: 300px; overflow-y: auto;"></div>
        </div>
        <!-- 當地市場 -->
        <div style="flex: 1; border: 1px solid rgba(139, 69, 19, 0.5); padding: 15px; background: rgba(0,0,0,0.5);">
          <h3 style="margin-top: 0;">市場商品</h3>
          <div id="trade-market" style="max-height: 300px; overflow-y: auto;"></div>
        </div>
      </div>
      
      <div style="margin-top: 20px;">
        <h4 id="trade-modal-msg-title">與此據點進行貿易</h4>
        <p id="trade-modal-msg-desc">單線跑商：派商隊前往此地，抵達後可立即進行交易與購買特產。</p>
        <button id="btn-diplomacy" class="action-btn" style="background: linear-gradient(135deg, #2563eb, #1d4ed8); display: none;">派遣外交使節</button>
        <button id="btn-plan-route" class="action-btn" style="background: linear-gradient(135deg, #059669, #047857);">發起單線跑商</button>
        <button id="btn-close-trade" class="action-btn" style="background: linear-gradient(135deg, #b91c1c, #991b1b);">關閉</button>
      </div>
    </div>
  </div>

  <!-- 頂部資源列 -->
  <div id="top-bar" style="display: none;">
    <div class="resource-group">
      <div class="resource-item"><span class="resource-icon">🏰</span> <span id="ui-location">世界地圖</span></div>
      <div class="resource-item"><span class="resource-icon">👑</span> <span id="ui-title">平民</span></div>
    </div>
    <div class="resource-group">
      <div class="resource-item" data-tip="總人口"><span class="resource-icon">👥</span> <span id="ui-population">0</span></div>
      <div class="resource-item" data-tip="治安度 (影響產出與稅收)"><span class="resource-icon">🛡️</span> <span id="ui-security">100</span>%</div>
      <div class="resource-item" data-tip="糧食"><span class="resource-icon">🍞</span> <span id="ui-food">0</span></div>

      <div class="resource-item" data-tip="石材"><span class="resource-icon">🧱</span> <span id="ui-stone">0</span></div>

      <div class="resource-item" data-tip="生皮"><span class="resource-icon">🦬</span> <span id="ui-hide">0</span></div>
      <div class="resource-item" data-tip="棉麻"><span class="resource-icon">🌿</span> <span id="ui-cotton">0</span></div>
      <div class="resource-item" data-tip="金幣"><span class="resource-icon">💰</span> <span id="ui-gold">0</span></div>
    </div>
      <div class="resource-group" style="gap: 10px; align-items: center;">
      <div class="resource-item" id="ui-threat" data-tip="下一次威脅"><span class="resource-icon">⚠️</span> <span id="ui-threat-days">10天</span></div>
      <div class="resource-item" data-tip="遊戲日期"><span class="resource-icon">📅</span> <span id="ui-date">第 1 年 1 月 1 日</span></div>
    </div>
  </div>

<div class="modal-overlay" id="modal-story-editor">
  <div class="story-editor-shell glass-panel">
    <header class="story-editor-header">
      <div>
        <h2>🧭 故事工坊</h2>
        <p>開發工具：視覺化編排故事流程圖、配置獎勵與條件，支援一鍵專案寫入與遊戲測試。</p>
      </div>
      <div class="story-editor-header-actions">
        <button id="btn-story-history" class="action-btn">歷史快照</button>
        <button id="btn-story-export" class="action-btn">匯出 JSON</button>
        <button id="btn-story-publish" class="action-btn story-primary">寫入專案</button>
        <button id="btn-close-story-editor" class="close-btn">×</button>
      </div>
    </header>

    <!-- Tab Bar -->
    <nav class="story-tab-bar">
      <button class="story-tab active" data-tab="node-editor">📋 故事工坊工作台</button>
      <button class="story-tab" data-tab="fact-registry">🔗 線索登錄表</button>
    </nav>

    <!-- Tab 1: 一體化工作台（三欄） -->
    <div id="tab-node-editor" class="story-tab-panel active">
      <div class="story-editor-workspace">
        
        <!-- 左欄：故事庫清單與設定 -->
        <aside class="story-editor-sidebar">
          <div class="story-list-header">
            <div class="story-editor-section-title">故事庫</div>
            <button id="btn-story-new" class="action-btn">＋ 新增故事</button>
          </div>
          <input id="story-editor-story-search" type="search" placeholder="搜尋故事名稱或代號…">
          <div id="story-editor-story-list" class="story-editor-story-list"></div>

          <details open class="story-sidebar-details">
            <summary>故事設定</summary>
            <label>故事名稱<input id="story-editor-story-title" type="text"></label>
            <label>故事摘要<textarea id="story-editor-story-summary" rows="2"></textarea></label>
            <label class="story-editor-check"><input id="story-editor-story-enabled" type="checkbox"> 啟用這條故事</label>
          </details>

          <details class="story-sidebar-details">
            <summary>故事線索索引</summary>
            <div id="story-editor-facts" class="story-editor-facts"></div>
          </details>

          <div class="story-sidebar-footer">
            <button id="btn-story-reset-progress" class="action-btn">重新讀取磁碟</button>
          </div>
        </aside>

        <!-- 中欄：一體化節點導航與流程圖畫布 -->
        <main class="story-editor-canvas">
          <div class="graph-toolbar">
            <div class="graph-toolbar-main">
              <button id="btn-story-add-node" class="action-btn story-primary">＋ 新增節點</button>
              <button id="btn-graph-relayout" class="action-btn">🔀 重排</button>
              <button id="btn-graph-fit" class="action-btn">🔍 適應全景</button>
              <div class="graph-zoom-controls">
                <button id="btn-graph-zoom-out" class="zoom-btn" title="縮小">−</button>
                <span id="graph-zoom-val">100%</span>
                <button id="btn-graph-zoom-in" class="zoom-btn" title="放大">＋</button>
                <button id="btn-graph-zoom-reset" class="zoom-btn" title="重設縮放 1:1">1:1</button>
              </div>
            </div>
            <div class="graph-toolbar-legend">
              <span class="graph-legend-item legend-fact">── Fact 依賴</span>
              <span class="graph-legend-item legend-schedule">── 排程</span>
              <span class="graph-legend-item legend-victory">── 勝利</span>
              <span class="graph-legend-item legend-defeat">── 失敗</span>
              <span class="graph-legend-item legend-journey">╌╌ 途中</span>
            </div>
            <span id="graph-wire-hint" class="graph-wire-hint" hidden>🔌 點擊目標節點建立「排程」連線，或再點輸出埠取消</span>
          </div>

          <!-- 緊湊節點選取列 -->
          <div id="story-editor-node-pills" class="story-editor-node-pills"></div>

          <!-- 流程圖 SVG 畫布 -->
          <div id="story-graph-wrapper" class="graph-scroll-wrapper">
            <svg id="story-graph-svg"></svg>
          </div>

          <!-- 結構檢查狀態條 -->
          <div id="story-editor-validation" class="story-editor-validation"></div>
        </main>

        <!-- 右欄：節點屬性 Inspector -->
        <aside class="story-editor-inspector">
          <div id="story-editor-empty">在流程圖或上方列表選擇一個節點開始編輯。</div>
          <div id="story-editor-node-form" hidden>
            <div class="story-editor-section-title">節點內容</div>
            <label>節點代號<input id="story-node-id" type="text" placeholder="小寫英文＋底線，例：quest_dragon"></label>
            <label>出現機制
              <select id="story-node-channel">
                <option value="BOUNTY_BOARD">懸賞板 (BOUNTY_BOARD)</option>
                <option value="STREET_EVENT">街道訪客事件 (STREET_EVENT)</option>
                <option value="TAVERN_RUMOR">酒館傳聞 (TAVERN_RUMOR)</option>
                <option value="TERRITORY_EVENT">領地突發事件 (TERRITORY_EVENT)</option>
                <option value="TODO_LIST">領地待辦清單 (TODO_LIST)</option>
                <option value="EXPLORATION">發現據點時 (EXPLORATION)</option>
                <option value="SUBJUGATION">討伐結束後 (SUBJUGATION)</option>
                <option value="SUBJUGATION_JOURNEY">討伐途中 (SUBJUGATION_JOURNEY)</option>
                <option value="STORY_NODE">解鎖預設故事據點 (STORY_NODE)</option>
              </select>
            </label>
            <label>標題<input id="story-node-title" type="text"></label>
            <label>故事敘述（預設/首段）<textarea id="story-node-description" rows="3"></textarea></label>

            <!-- 💬 街道訪客與 NPC 對話演出設定 -->
            <details id="story-editor-npc-dialogue-fields" open>
              <summary>💬 NPC 訪客與對話演出設定</summary>
              <div class="story-editor-pair" style="margin-top: 6px;">
                <label>訪客 NPC 名稱<input id="story-node-npc-name" type="text" placeholder="例：神秘學者"></label>
                <label>訪客 NPC 肖像
                  <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                    <div id="story-node-npc-avatar-preview" style="width: 32px; height: 59px; border-radius: 4px; border: 1px solid #d97706; overflow: hidden; background: #0c0a09; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"></div>
                    <input id="story-node-npc-avatar" type="hidden" value="npc:npc_0">
                    <button id="btn-pick-node-npc-avatar" type="button" class="action-btn" style="flex: 1; padding: 6px 10px; font-size: 0.8rem; background: rgba(217, 119, 6, 0.2); border-color: rgba(217, 119, 6, 0.4); color: #fbbf24;">🔍 挑選 NPC 肖像</button>
                  </div>
                </label>
              </div>
              <div style="margin: 8px 0 4px; font-size: 0.78rem; font-weight: bold; color: #fde68a;">多段對話列表 (支援切換 NPC / 玩家守衛)：</div>
              <div id="story-node-dialogue-pages-list" class="story-dialogue-pages-list" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px;"></div>
              <button id="btn-story-add-dialogue-page" type="button" class="action-btn" style="width: 100%;">＋ 新增對話段落</button>
            </details>

            <details open>
              <summary>出現條件</summary>
              <div id="story-node-conditions-list" class="story-effect-list"></div>
              <button id="btn-story-add-condition" type="button" class="action-btn">＋ 新增條件</button>
            </details>

            <details open>
              <summary>完成後結果／獎勵</summary>
              <div id="story-node-effects-list" class="story-effect-list"></div>
              <button id="btn-story-add-effect" type="button" class="action-btn">＋ 新增結果／獎勵</button>
            </details>

            <details id="story-editor-map-target-fields">
              <summary>解鎖預設故事據點設定</summary>
              <label>既有地圖節點 ID<input id="story-node-target-map" type="text" placeholder="例：node_fortress_gate"></label>
            </details>

            <details id="story-editor-bounty-fields">
              <summary>懸賞設定</summary>
              <div style="margin-bottom: 8px;">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; color: #60a5fa;">
                  <input id="story-node-bounty-repeatable" type="checkbox"> 🔄 允許日常重複輪替 (Repeatable)
                </label>
              </div>
              <div class="story-editor-pair">
                <label>執行天數<input id="story-node-bounty-duration" type="number" min="1" value="2"></label>
                <label>保留天數<input id="story-node-bounty-expire" type="number" min="1" value="4"></label>
              </div>
              <div class="story-editor-pair">
                <label>金幣獎勵<input id="story-node-bounty-gold" type="number" min="0" value="50"></label>
                <label>經驗獎勵<input id="story-node-bounty-exp" type="number" min="0" value="30"></label>
              </div>
              <div class="story-editor-pair">
                <label>任務類型
                  <select id="story-node-bounty-type">
                    <option value="NORMAL">普通任務 (NORMAL)</option>
                    <option value="BANDIT">強盜治安 (BANDIT - 過期增威脅)</option>
                  </select>
                </label>
                <label>刷新冷卻天數<input id="story-node-bounty-cooldown" type="number" min="0" value="3"></label>
              </div>
            </details>

            <details open>
              <summary>玩家決策選項（支援自由多選項）</summary>
              <div id="story-node-choices-list" class="story-choices-list"></div>
              <button id="btn-story-add-choice" type="button" class="action-btn">＋ 新增決策選項</button>
            </details>

            <div class="story-editor-node-actions">
              <button id="btn-story-test-node" class="action-btn story-primary">強制測試節點</button>
              <button id="btn-story-delete-node" class="action-btn story-danger">刪除節點</button>
            </div>
            <div id="story-editor-blocked-reasons" class="story-editor-blocked"></div>
          </div>
        </aside>
      </div>
    </div>

    <!-- Tab 2: 線索登錄表 -->
    <div id="tab-fact-registry" class="story-tab-panel" hidden>
      <div class="fact-registry-toolbar">
        <div class="fact-registry-search-wrap">
          <input id="fact-registry-search" type="search" placeholder="搜尋線索代號或節點名稱…">
        </div>
        <div class="fact-registry-stats" id="fact-registry-stats"></div>
      </div>
      <div id="fact-registry-list" class="fact-registry-list"></div>
    </div>

  </div>

  <!-- 🖼️ 故事工坊 NPC 肖像視覺化挑選彈窗 (#modal-story-avatar-picker) -->
  <div id="modal-story-avatar-picker" class="modal-overlay" style="display: none; position: fixed; inset: 0; z-index: 99999; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); justify-content: center; align-items: center;">
    <div class="glass-panel" style="width: min(720px, 92vw); max-height: 85vh; display: flex; flex-direction: column; background: #1a1614; border: 1.5px solid #d97706; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); overflow: hidden;">
      <!-- 頂部標題與關閉按鈕 -->
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid rgba(217,119,6,0.3); background: rgba(0,0,0,0.3);">
        <div style="font-weight: bold; font-size: 1.1rem; color: #fbbf24; display: flex; align-items: center; gap: 8px;">
          <span>🖼️ 選擇 NPC 肖像</span>
        </div>
        <button id="btn-close-story-avatar-picker" type="button" class="close-btn" style="background: transparent; border: none; font-size: 1.4rem; color: #94a3b8; cursor: pointer;">×</button>
      </div>

      <!-- 工具欄：分類過濾與搜尋 -->
      <div style="display: flex; gap: 10px; padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.2);">
        <select id="story-avatar-category-filter" style="background: #26201b; color: #fbbf24; border: 1px solid rgba(217,119,6,0.4); border-radius: 6px; padding: 6px 10px; font-size: 0.85rem;">
          <!-- JS 動態生成所有圖庫分類 -->
        </select>
        <input id="story-avatar-search-input" type="search" placeholder="搜尋肖像名稱或編號..." style="flex: 1; background: #26201b; color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 6px 12px; font-size: 0.85rem;">
      </div>

      <!-- 肖像卡片網格 -->
      <div id="story-avatar-picker-grid" style="flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 12px; max-height: 460px;">
        <!-- JS 動態渲染肖像卡片 -->
      </div>
    </div>
  </div>
</div>
